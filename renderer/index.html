<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qiosk</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- 1. Welcome / attract screen -->
    <section id="screen-welcome" class="screen active" data-action="start">
      <div class="welcome-bg" aria-hidden="true">
        <span>🌯</span><span>🥙</span><span>🧀</span><span>🍯</span><span>🍢</span><span>🥤</span>
      </div>
      <div class="welcome-content">
        <div class="brand-mark">☪︎</div>
        <h1 class="restaurant-name" data-bind="restaurantName"></h1>
        <p class="welcome-sub" data-i18n="welcomeSub"></p>
        <button class="btn btn-primary btn-huge pulse" data-action="start" data-i18n="touchToOrder"></button>
        <div class="lang-switch" role="group">
          <button class="lang-btn" data-lang="ro">🇷🇴 Română</button>
          <button class="lang-btn" data-lang="en">🇬🇧 English</button>
        </div>
      </div>
    </section>

    <!-- 2. Eat in / take away -->
    <section id="screen-dining" class="screen">
      <h2 class="screen-title" data-i18n="whereEat"></h2>
      <div class="dining-options">
        <button class="dining-card" data-dining="eat-in">
          <span class="dining-icon">🍽️</span>
          <span data-i18n="eatIn"></span>
        </button>
        <button class="dining-card" data-dining="take-away">
          <span class="dining-icon">🛍️</span>
          <span data-i18n="takeAway"></span>
        </button>
      </div>
      <button class="btn btn-ghost" data-action="cancel" data-i18n="back"></button>
    </section>

    <!-- 3. Menu -->
    <section id="screen-menu" class="screen">
      <header class="topbar">
        <div class="topbar-brand"><span class="brand-mark small">☪︎</span><span data-bind="restaurantName"></span></div>
        <div class="topbar-right">
          <span class="dining-badge" id="dining-badge"></span>
          <button class="lang-btn small" data-lang-toggle></button>
          <button class="btn btn-ghost small" data-action="cancel" data-i18n="cancelOrder"></button>
        </div>
      </header>
      <button class="promo" id="promo" hidden>
        <span class="promo-icon" id="promo-icon"></span>
        <span class="promo-text">
          <span class="promo-title" id="promo-title"></span>
          <span class="promo-sub" id="promo-sub"></span>
        </span>
        <span class="promo-cta" id="promo-cta"></span>
      </button>
      <div class="menu-layout">
        <nav class="category-rail" id="category-rail"></nav>
        <main class="product-area">
          <h2 class="category-title" id="category-title"></h2>
          <div class="product-grid" id="product-grid"></div>
        </main>
        <aside class="order-panel" id="order-panel">
          <div class="panel-head">
            <h2 data-i18n="yourOrder"></h2>
            <span class="panel-count" id="panel-count">0</span>
          </div>
          <div class="panel-empty" id="panel-empty">
            <span class="panel-empty-icon">🛒</span>
            <p data-i18n="emptyCart"></p>
            <small data-i18n="emptyHint"></small>
          </div>
          <div class="panel-list" id="panel-list"></div>
          <div class="panel-foot">
            <div class="summary-row"><span data-i18n="kcalTotal"></span><span id="panel-kcal"></span></div>
            <div class="summary-row total"><span data-i18n="total"></span><span id="panel-total"></span></div>
            <button class="btn btn-primary btn-large btn-block" data-action="checkout" id="btn-checkout" data-i18n="checkout"></button>
          </div>
        </aside>
      </div>
    </section>

    <!-- 4. Payment method -->
    <section id="screen-payment" class="screen">
      <header class="topbar">
        <button class="btn btn-ghost small" data-action="back-to-menu" data-i18n="back"></button>
        <h2 class="topbar-title" data-i18n="howPay"></h2>
        <span class="topbar-spacer"></span>
      </header>
      <div class="pay-content">
        <p class="pay-amount-label" data-i18n="total"></p>
        <div class="pay-amount" id="pay-amount"></div>
        <div class="pay-options">
          <button class="pay-card" data-pay="card" id="pay-opt-card">
            <span class="pay-icon">💳</span>
            <span class="pay-title" data-i18n="payCard"></span>
            <span class="pay-sub" data-i18n="payCardSub"></span>
          </button>
          <button class="pay-card" data-pay="cash" id="pay-opt-cash">
            <span class="pay-icon">💵</span>
            <span class="pay-title" data-i18n="payCounter"></span>
            <span class="pay-sub" data-i18n="payCounterSub"></span>
          </button>
        </div>
      </div>
    </section>

    <!-- 5. Card terminal -->
    <section id="screen-card" class="screen">
      <div class="card-content">
        <div class="card-amount"><span data-i18n="amountToPay"></span> <strong id="card-amount"></strong></div>

        <div class="card-state" id="card-waiting">
          <div class="terminal-anim" aria-hidden="true">
            <div class="terminal">
              <div class="terminal-screen"><span id="terminal-amount"></span><span class="terminal-waves">)))</span></div>
              <div class="terminal-keys"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="bank-card"><span class="chip"></span></div>
          </div>
          <h2 data-i18n="tapCard"></h2>
          <p class="card-hint" data-i18n="tapCardSub"></p>
          <div class="terminal-arrow">⬇</div>
          <div class="spinner-row"><span class="spinner"></span><span data-i18n="waitingTerminal"></span></div>
          <button class="btn btn-ghost" data-action="cancel-payment" data-i18n="cancelPayment"></button>
        </div>

        <div class="card-state" id="card-declined" hidden>
          <div class="declined-icon">✕</div>
          <h2 data-i18n="paymentFailed"></h2>
          <p class="card-hint" id="card-declined-msg"></p>
          <div class="declined-actions">
            <button class="btn btn-primary btn-large" data-action="retry-card" data-i18n="tryAgain"></button>
            <button class="btn btn-secondary btn-large" data-action="pay-counter-instead" id="btn-counter-instead" data-i18n="payCounter"></button>
            <button class="btn btn-ghost" data-action="cancel-payment" data-i18n="backToOrder"></button>
          </div>
        </div>
      </div>
    </section>

    <!-- 6. Confirmation -->
    <section id="screen-done" class="screen">
      <div class="done-content">
        <div class="done-check">✓</div>
        <h2 id="done-title"></h2>
        <p class="done-label" data-i18n="orderNumber"></p>
        <div class="order-number" id="done-number"></div>
        <p class="done-pay"><span id="done-pay-label"></span> <strong id="done-total"></strong></p>
        <p class="done-hint" id="done-hint"></p>
        <button class="btn btn-primary btn-large" data-action="finish" data-i18n="newOrder"></button>
      </div>
    </section>
  </div>

  <!-- Product customisation dialog -->
  <div class="modal-backdrop" id="product-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" data-action="close-modal" aria-label="Close">✕</button>
      <div class="modal-hero">
        <span class="modal-icon" id="pm-icon"></span>
        <div>
          <h2 id="pm-name"></h2>
          <p id="pm-desc"></p>
        </div>
      </div>
      <div class="modal-body">
        <div id="pm-meat-section">
          <h3 data-i18n="chooseMeat"></h3>
          <div class="option-grid" id="pm-meats"></div>
        </div>
        <div id="pm-extra-section">
          <h3 data-i18n="extras"></h3>
          <div class="option-grid" id="pm-extras"></div>
        </div>
        <h3 data-i18n="nutrition"></h3>
        <div class="nutrition" id="pm-nutrition"></div>
        <p class="allergens" id="pm-allergens"></p>
      </div>
      <div class="modal-footer">
        <div class="qty">
          <button class="qty-btn" data-action="qty-minus" aria-label="-">−</button>
          <span id="pm-qty">1</span>
          <button class="qty-btn" data-action="qty-plus" aria-label="+">+</button>
        </div>
        <button class="btn btn-primary btn-large" data-action="add-to-order">
          <span id="pm-add-label"></span> · <span id="pm-price"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- "Are you still there?" dialog -->
  <div class="modal-backdrop" id="idle-modal" hidden>
    <div class="modal small">
      <h2 data-i18n="stillThere"></h2>
      <p><span data-i18n="resetIn"></span> <strong id="idle-count"></strong></p>
      <button class="btn btn-primary btn-large" data-action="still-here" data-i18n="yesContinue"></button>
    </div>
  </div>

  <!-- Accessibility: lowers the whole interface into reach (wheelchair users, children) -->
  <button class="access-btn" data-action="toggle-access" id="access-btn">
    <span class="access-icon">♿</span><span class="access-label" id="access-label"></span>
  </button>
  <div class="access-note" id="access-note" aria-hidden="true"><span>♿</span><span id="access-note-text"></span></div>

  <div class="toast" id="toast" hidden></div>

  <script src="../src/pricing.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
